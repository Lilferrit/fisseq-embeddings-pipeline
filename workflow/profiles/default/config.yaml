# Auto-applied workflow profile -- Snakemake loads workflow/profiles/default/
# relative to the Snakefile with no flag, so these apply to a bare
# `snakemake` invocation.

# The equivalent of every Nextflow process carrying `errorStrategy 'ignore'`:
# independent branches of the DAG keep running when one job fails, which is
# what keeps the two feature tracks independent of each other.
#
# One real difference, and an improvement: snakemake still EXITS NON-ZERO
# when a job failed, where `nextflow run` exited 0 and left you to notice the
# missing output file yourself.
keep-going: true

# Match the nested starcall invocation's own --rerun-triggers mtime. Without
# this, Snakemake also reruns on params/input/software-env/code changes, so
# editing a rule's comment would invalidate every completed stage of a
# long-running experiment.
rerun-triggers:
  - mtime
