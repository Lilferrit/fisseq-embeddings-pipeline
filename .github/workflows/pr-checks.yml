name: PR Checks

# Runs on every pull request against main: unit tests, the Nextflow
# integration suite, and lint. `-profile local` (nextflow.config) needs no
# Docker image, and EMBED_CELLS' GPU/checkpoint dependency runs against a
# tiny CPU-only stub checkpoint the integration fixture builds itself (see
# AGENTS.md's Testing section) -- so the whole suite is cheap and
# dependency-free enough to run on every PR, not gated to a slower
# schedule. Container build/push and docs deploy happen separately, on
# push to main -- see docker.yml / docs.yml.

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # The integration suite drives the real Nextflow pipeline
      # (tests/integration/test_integration.py, -profile local -- no
      # Docker image needed); without nextflow on PATH it's skipped
      # entirely (shutil.which), but install it so the suite actually
      # runs, not just no-ops green.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      - name: Run integration tests
        run: uv run pytest tests/integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check (lint, including import order)
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .
