name: CI

# fisseq-embeddings-pipeline is currently a local-only repo (no remote
# configured -- see AGENTS.md's Git workflow section), so this workflow is
# inert until a remote exists; it's added now so CI is already decided and
# in place the moment one is. `master` (not `main`) is this repo's actual
# default/integration branch -- see AGENTS.md.
#
# integration-tests (Epic 11 Story 11.2) runs on every push/PR, same
# cadence as unit-tests/lint below -- not gated to a slower schedule.
# Unlike fisseq-data-pipeline's equivalent job (which this one mirrors,
# .github/workflows/pr-checks.yml), there's no GPU or real-checkpoint cost
# to weigh here: `-profile local` (nextflow.config) needs no Docker image,
# and EMBED_CELLS' GPU/checkpoint dependency runs against a tiny CPU-only
# stub checkpoint the fixture builds itself (see AGENTS.md's Testing
# section / SPEC.md §9.3's Resolved note) -- so the whole suite is cheap
# and dependency-free enough to run unconditionally.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # The integration suite drives the real Nextflow pipeline
      # (tests/integration/test_integration.py, -profile local -- no
      # Docker image needed); without nextflow on PATH it's skipped
      # entirely (shutil.which), but install it so the suite actually
      # runs, not just no-ops green.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      - name: Run integration tests
        run: uv run pytest tests/integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check (lint, including import order)
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .
