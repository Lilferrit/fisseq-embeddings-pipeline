name: Docker image

# Image versioning/publishing policy:
#
#   - Registry: GitHub Container Registry, ghcr.io/<owner>/<repo> (derived
#     from ${{ github.repository }}, not hardcoded -- natural fit for a
#     GitHub-hosted repo, no separate registry account to provision).
#   - Tag scheme, on every push to main: `:latest` (moving) and
#     `:<short-sha>` (exact, reproducible per-commit reference -- what
#     params.yaml's container_image should point at for anything that
#     needs to pin a specific build rather than float on `:latest`).
#     On a pushed `v*` tag (a real release): additionally `:<version>`
#     (the tag name with its `v` prefix stripped, e.g. `v0.1.0` -> `0.1.0`).
#   - Every PR: build-only, no push, no registry credentials needed -- a
#     smoke test against Dockerfile regressions.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs only ever build (catches a broken Dockerfile before merge);
      # only a push to main or a v* tag pushes an image anywhere.
      - name: Build (PR -- no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tags="${image}:latest,${image}:${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tags="${tags},${image}:${version}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
