name: Deploy docs

# Builds the mkdocs site and force-pushes it to the gh-pages branch on
# every push to main -- gh-pages holds only the generated site, never
# checked in alongside the source on main.
#
# workflow_dispatch is a manual escape hatch: GitHub's push-path-filter
# diffing can silently no-op on a push with no common ancestor (e.g. a
# force-push/rebase of history that hadn't been pushed yet), which is
# exactly what let this workflow go from repo setup until now without
# ever actually running. Without workflow_dispatch, recovering from
# that requires a throwaway commit touching one of the watched paths.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
