# Run every rule inside the published image instead of the Python
# environment that invoked snakemake:
#
#   snakemake --configfile params.yaml --profile profiles/apptainer -c 8
#
# This is the opt-in path. A bare `snakemake` runs against the invoking
# environment (this repo's own uv venv), which is what the integration suite
# and any Docker-less/GPU-less CI runner use. Under Nextflow the polarity was
# the other way round -- containerized by default, `-profile local` to opt
# out -- because Nextflow has a Docker backend and Snakemake does not.
#
# Apptainer runs the existing `docker://` image unchanged, so the root
# Dockerfile is the same artifact it always was; only the runtime differs.

software-deployment-method:
  - apptainer

# Where Snakemake pulls and converts the image to a .sif. Mirrored into the
# apptainer_prefix CONFIG key below because a rule cannot read the deployment
# setting -- build_cell_images needs it to find the .sif its per-rule cluster
# jobs re-enter the image with. The two must agree.
apptainer-prefix: .apptainer

# Do NOT add `-B ...` here. Apptainer's own --bind flag REPLACES
# $APPTAINER_BIND rather than merging with it, and every host path this
# pipeline needs travels through that variable (config/binds.py, exported at
# parse time). Extra site paths go in params.yaml's extra_bind_paths.

config:
  # The in-image locations of the three things the nested starcall
  # invocation reaches. The ops conda env is deliberately kept off the
  # image's PATH so bare `python` always resolves to this repo's own 3.13
  # venv, never ambiguously to the env's 3.10 -- hence absolute paths.
  - snakemake_bin=/opt/conda/envs/ops/bin/snakemake
  - conda_bin_dir=/opt/conda/bin
  - starcall_overrides_dir=/opt/fisseq-embeddings-pipeline/resources/starcall_overrides
  - apptainer_prefix=.apptainer
