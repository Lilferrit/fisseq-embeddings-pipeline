# SGE deployment, ported from the Nextflow `sge` profile this repo used to
# carry in a gitignored scratch/nextflow.config. Committed here as the worked
# example; keep genuinely site-local values (paths, project, queue) in your
# own copy, and pass it with `--profile /path/to/your/profile`.
#
#   snakemake --configfile params.yaml --profile profiles/sge
#
# Snakemake has no first-party SGE executor, so this uses the cluster-generic
# plugin -- the direct descendant of snakemake 7's `--cluster`, which keeps
# the submit line legible next to the one the nested starcall invocation
# builds in resources/starcall_overrides/sge_submit.sh.

executor: cluster-generic
cluster-generic-submit-cmd: >-
  qsub -cwd -V -terse
  -q fowler-long.q -P fowler_noble
  -pe serial {threads}
  -l mfree={resources.mem_mb}M {resources.sge_extra}
  -N smk.{rule}.{jobid}
  -o {config[pipeline_dir]}/logs -e {config[pipeline_dir]}/logs
cluster-generic-cancel-cmd: qdel

jobs: 64
latency-wait: 120
max-status-checks-per-second: 0.5
rerun-incomplete: true

# The Nextflow profile retried only on exit status 137/140 (OOM kills) and
# ignored everything else. Snakemake cannot condition a retry on exit status,
# so this splits into keep-going (the 'ignore' half, inherited from
# workflow/profiles/default) plus a small unconditional retry budget --
# deliberately lower than that profile's maxRetries 4, since every failure is
# now retried, not just the OOM kills.
retries: 1

software-deployment-method:
  - apptainer
apptainer-prefix: /net/fowler/vol1/shared/fisseq-analysis-pipeline/cellDINO/.apptainer

# Snakemake has no `label` concept, so the four nf-core resource labels are
# enumerated per rule here. Each rule's own `resources: mem_mb=` in
# workflow/rules/*.smk is the local-run default; these override it.
default-resources:
  mem_mb: 8000
  sge_extra: ""

set-threads:
  build_cell_images: 1
  build_cell_metadata: 2
  qc_filter: 2
  build_cp_features: 2
  filter_embeddings: 2
  filter_cp_features: 2
  build_dataset: 4
  aggregate_embeddings: 4
  aggregate_cp_features: 4
  global_variant_embeddings: 4
  global_variant_distinguishability: 4
  global_variant_cp_features: 4
  global_variant_distinguishability_cp_features: 4
  embed_cells: 8
  ovwt_batchwise: 8
  ovwt_batchwise_cp_features: 8

set-resources:
  # The one genuinely GPU-bound rule. build_cell_images deliberately does NOT
  # get `-l cuda=1`: it is a babysitter for the nested snakemake, and in
  # cluster mode that nested run requests GPUs for its own segmentation rules
  # itself (see snakemake_cluster_args below). Under Nextflow both carried
  # `label 'process_gpu'`, so build_cell_images queued behind GPU
  # availability for no benefit.
  embed_cells:
    mem_mb: 65536
    sge_extra: "-l cuda=1"
  ovwt_batchwise:
    mem_mb: 65536
  ovwt_batchwise_cp_features:
    mem_mb: 65536
  build_dataset:
    mem_mb: 32768
  aggregate_embeddings:
    mem_mb: 32768
  aggregate_cp_features:
    mem_mb: 32768
  build_cell_images:
    mem_mb: 8192
    sge_extra: "-l h_rt=72:0:0"

config:
  - snakemake_bin=/opt/conda/envs/ops/bin/snakemake
  - conda_bin_dir=/opt/conda/bin
  - starcall_overrides_dir=/opt/fisseq-embeddings-pipeline/resources/starcall_overrides
  - apptainer_prefix=/net/fowler/vol1/shared/fisseq-analysis-pipeline/cellDINO/.apptainer
  - starcall_apptainer_bin=singularity
  - starcall_host_overrides_dir=/net/fowler/vol1/shared/fisseq-analysis-pipeline/cellDINO/fisseq-embeddings-pipeline/resources/starcall_overrides
  - extra_bind_paths=["/net/fowler/vol1/shared","/opt/sge"]
  - starcall_cluster_env={"STARCALL_SGE_PROJECT":"fowler_noble","STARCALL_SGE_QUEUE":"fowler-long.q","STARCALL_SGE_RUNTIME":"48:0:0","SGE_ROOT":"/opt/sge","SGE_CELL":"default"}
  - snakemake_cluster_cores=128
  # Makes the NESTED starcall snakemake submit each of its own rules as a
  # separate SGE job, rather than forking them inside this one. Note the GPU
  # request is made with --set-resources, not from the rules' own resources:
  # starcall's devel branch has `cuda = 1` commented out on every
  # segmentation rule, so relying on the declared values puts everything on
  # CPU nodes.
  - >-
    snakemake_cluster_args=--cluster "$STARCALL_SUBMIT_SCRIPT {rule} {jobid} {threads} {resources.mem_mb} {resources.cuda}"
    --cluster-cancel qdel --jobs 64 --default-resources cuda=0
    --set-resources segment_nuclei:cuda=1 segment_cells:cuda=1 segment_cells_bases:cuda=1 segment_nuclei_bases:cuda=1
    --local-cores 1 --scheduler greedy --latency-wait 120 --max-status-checks-per-second 0.5
    --keep-incomplete --rerun-incomplete --conda-base-path /opt/conda
