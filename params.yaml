# params.yaml -- every default pipeline parameter, nothing else. Load
# explicitly:
#
#   nextflow run . -params-file params.yaml --pipeline_dir /path/to/run \
#       --cell_dino_checkpoint /path/to/checkpoint.pth
#
# Per-run overrides: `--key value` on the command line wins over this file.
# Executor/container settings live in nextflow.config and your own site
# config (`-c site.config`; see docs/nextflow.md) -- never default parameter
# values.

# ── Required, no default (fail fast if unset) ──────────────────────────────
pipeline_dir: null
container_image: "fisseq-embeddings-pipeline:latest"
cell_dino_checkpoint: null
experiments: []

# ── Per-experiment configs (BUILD_CELL_IMAGES / BUILD_DATASET / BUILD_CP_FEATURES) ──
# Each experiment map in `experiments:` below supplies fields for up to
# three stages:
#
# - BUILD_CELL_IMAGES (starcall-workflow-facing, always runs):
#   starcall_workflow_dir, phenotyping_dir, segmentation_dir,
#   sequencing_dir, wells, grid_size, segmentation_type, use_corrected,
#   sequencing_reads_params. This is the ONLY stage that touches
#   starcall-workflow's tree or invokes Snakemake -- see
#   docs/architecture.md's Data contracts section. `starcall_workflow_dir`
#   is per-experiment (not a shared global path) since Snakemake keeps
#   invocation-scoped lock/log state in its own working directory --
#   nothing requires it to be named "starcall-workflow" or nested under a
#   separate per-experiment folder of its own: it can just BE your
#   experiment's root directory (e.g. `starcall_workflow_dir:
#   /data/experiment1`, not `/data/experiment1/starcall-workflow`) --
#   `phenotyping_dir`/`segmentation_dir`/`sequencing_dir` default under
#   whatever you point it at.
#   `phenotyping_dir`/`segmentation_dir`/`sequencing_dir` are all OPTIONAL
#   -- each is auto-resolved when omitted: if `starcall_workflow_dir` has
#   its own `config.yaml` (or `default-config.yaml`), that project's own
#   value for the key is used (reading the actual config that governs
#   where Snakemake writes/reads these trees -- correct even if a project
#   remaps them to nonstandard names); otherwise it falls back to a
#   subdirectory of `starcall_workflow_dir` (`phenotyping`/`segmentation`/
#   `sequencing`), matching starcall-workflow's own documented default.
#   Set one explicitly only when that tree isn't colocated under
#   `starcall_workflow_dir` at all for your lab (e.g. `sequencing_dir` on
#   separate storage) -- an explicit value always wins over both. See
#   docs/architecture.md and the example below.
# - BuildDatasetConfig (BUILD_DATASET): window, shard_maxcount,
#   barcode_col_name/aa_changes_col_name/edit_distance_col_name.
#   `cell_images_dir` is injected automatically from BUILD_CELL_IMAGES'
#   own output -- never set it yourself.
# - CpFeaturesConfig (BUILD_CP_FEATURES, only for `cp_features: true`
#   entries): barcode_col_name/aa_changes_col_name/edit_distance_col_name
#   (same three fields, shared with BuildDatasetConfig since both read the
#   same cell_table.parquet). `cell_images_dir` is injected the same way.
#
# `batch_stem` is required on every map (there's no filename to derive it
# from), must be unique across the list, and any field a map omits falls
# back to the matching global default in "Shared per-experiment defaults"
# below (`window`, `cellprofiler_pipeline`, `cellprofiler_cycle`), or
# failing that, the relevant stage's own Hydra default (or raises an error
# if that field has none, e.g. starcall_workflow_dir).
#
# `grid_size` is optional -- when omitted, it's auto-detected per well by
# scanning phenotyping_dir for that well's `{well}_grid<N>` directory
# (starcall-workflow's own naming convention already encodes it there),
# and only tiles already on disk are requested. Set it explicitly for a
# run starting from raw input (nothing under phenotyping_dir yet): every
# tile of the grid is then requested from starcall, whether or not it
# exists yet.
#
# `sequencing_reads_params` (default "") is the `{params}` wildcard
# component of starcall-workflow's `{segmentation_type}_reads{params}.csv`
# output filename -- almost always empty; set it explicitly only if your
# starcall-workflow config uses a non-empty value there (verify against a
# real run -- see docs/architecture.md's flagged risks).
#
# Set `cp_features: true` on an entry to also run that experiment through
# the CellProfiler-feature track (see docs/architecture.md):
# BUILD_CP_FEATURES onward, and BUILD_CELL_IMAGES additionally forces +
# folds in that experiment's CellProfiler CSV. `cellprofiler_pipeline`/
# `cellprofiler_cycle` can be set directly on a `cp_features: true` entry
# to override this experiment's CellProfiler filename components, falling
# back to the global defaults below when omitted. Omit `cp_features` (or
# leave it `false`) for a cellDINO-only experiment -- the default, so
# existing runs work unchanged.
#
# The empty list below is deliberate -- every real run supplies its own
# `experiments:` list by editing this file (or a full copy of it, passed as
# a different --configfile; there's no "just point at a directory of
# per-experiment files" shortcut).
#
# experiments:
#   - batch_stem: experiment1
#     starcall_workflow_dir: /data/experiment1   # IS this experiment's root -- no separate folder needed
#     # phenotyping_dir/segmentation_dir/sequencing_dir omitted -- default
#     # to /data/experiment1/{phenotyping,segmentation,sequencing}
#     wells: [well1, well2]        # grid_size omitted -- auto-detected per well
#     # window omitted -- falls back to the global `window` default below
#     cp_features: true            # also run the CellProfiler-feature track for this experiment
#     # cellprofiler_pipeline/cellprofiler_cycle omitted -- fall back to
#     # the global defaults below
#   - batch_stem: experiment2
#     starcall_workflow_dir: /data/experiment2
#     # sequencing data lives on separate storage for this experiment --
#     # phenotyping_dir/segmentation_dir still default under
#     # starcall_workflow_dir, only sequencing_dir is overridden
#     sequencing_dir: /mnt/sequencer-storage/experiment2/sequencing
#     wells: [well3]
#     grid_size: 8                 # explicit override
#     window: 180                  # per-experiment override of the global default
#     # cp_features omitted -- cellDINO-only for this experiment

# ── Shared per-experiment defaults (window / cellprofiler_pipeline / cellprofiler_cycle) ──
# `window` (BuildDatasetConfig: the crop size each cell is cut at) and
# `cellprofiler_pipeline`/`cellprofiler_cycle` (CpFeaturesConfig-facing,
# consumed by BUILD_CELL_IMAGES) are logically per-experiment fields (see
# "Per-experiment configs" above), but in practice are almost always the
# same value across every experiment in a run -- one crop size per
# Cell-DINO checkpoint, one CellProfiler pipeline per run. Set the shared
# value once here; `config/experiments.py` fills it in (via two
# independent fallback blocks, one per stage) for any `experiments:` entry
# that doesn't set its own value for that key, and an entry that *does* set
# its own value always wins over the global default here.
window: 224                    # crop size in pixels -- must match cell_dino_crop_size below
cellprofiler_pipeline: null    # the CellProfiler .cppipe pipeline's basename -- required (here, or per `cp_features: true` entry) once any experiment sets cp_features: true
cellprofiler_cycle: ""         # "" (no cycle) unless starcall-workflow ran cellprofiler per-cycle


# ── Nested starcall run (BUILD_CELL_IMAGES) ──────────────────────────────────
# BUILD_CELL_IMAGES runs starcall-workflow's own Snakefile as a nested
# snakemake (7.32, in the image's ops env). By default every starcall rule
# runs inside that one task:
snakemake_cores: 4             # the nested run's --cores in local mode (no starcall_profile)
#
# To fan starcall's rules out across your cluster instead, point
# starcall_profile at a snakemake 7 profile directory saying how to submit
# jobs (`cluster:`, `cluster-cancel:`, `jobs:`, resources...). It lives
# outside this repo -- nothing scheduler-specific does. Each submitted job
# lands on a bare node but has to run inside the pipeline image (starcall's
# rule bodies execute in the ops env's interpreter), so BUILD_CELL_IMAGES
# also passes a --jobscript that re-enters starcall_job_image there. See
# docs/nextflow.md.
starcall_profile: null         # path to a snakemake 7 profile dir; null = local mode
starcall_job_image: null       # a .sif of container_image on storage every node can read -- required with starcall_profile
starcall_container_bin: apptainer  # what a child job re-enters the image with; some nodes only ship `singularity`
#
# Where BUILD_CELL_IMAGES points $XDG_CACHE_HOME (and $HOME) for the nested
# run. Snakemake mkdir's $XDG_CACHE_HOME/snakemake while constructing its
# Workflow object -- before any rule runs, with no flag to move it -- and
# under Apptainer $HOME is often a read-only cluster home ("OSError: [Errno
# 30] Read-only file system"). null resolves to
# <pipeline_dir>/.snakemake_cache, which is writable and persists across
# runs. It's bind-mounted into BUILD_CELL_IMAGES' container automatically.
snakemake_cache_dir: null
# Request a GPU for the nested starcall run -- its segmentation rules run
# stardist/cellpose/tensorflow out of the ops env. Adds --nv/--gpus to
# BUILD_CELL_IMAGES' container, and --nv to every child job in cluster
# mode. Apptainer only warns on a GPU-less node; Docker's --gpus fails
# outright there, so set this false on a GPU-less Docker host.
starcall_gpu: true

# ── Stopping early ───────────────────────────────────────────────────────────
# true = stop after EMBED_CELLS: no QC-dependent cellDINO stages, no
# reproducibility filtering, no CellProfiler track, no global stages.
embeddings_only: false

# ── Reproducibility ──────────────────────────────────────────────────────────
random_seed: 0

# ── QC filtering (QC_FILTER) ─────────────────────────────────────────────────
barcode_count_threshold: 10
variant_barcode_count_threshold: 4
edit_distance_threshold: 1
# QcFilterConfig's own label_column is wired to filter_label_column below,
# so overriding one label column changes it pipeline-wide.
#
# Deliberately NOT exposed here:
#   - barcode_col_name / aa_changes_col_name / edit_distance_col_name:
#     these name BUILD_DATASET's fixed "meta_barcode"/"meta_aa_changes"/
#     "meta_edit_distance" output columns -- structural, not something a
#     per-run override should ever change.
#   - n_variants / variant_downsample_classes / variant_downsample_mode /
#     variant_allow_list_file: the optional per-class variant-downsampling
#     cap (distinct from the dropped downsample_amounts/downsample_classes/
#     downsample_seed pseudo-variant machinery -- this one is real, just
#     off by default). n_variants defaults to null (disabled); enable via a
#     direct Hydra override on QC_FILTER if ever needed. Not promoted to a
#     global param because variant_downsample_classes' default ("Single
#     Missense") contains a space, which this repo's List ->
#     'key=[a,b]' Groovy-interpolation convention (used by
#     aggregate_methods/cell_dino_channels/etc.) can't round-trip safely
#     without per-element quoting.

# ── Cell Embeddings / Cell-DINO (EMBED_CELLS) ────────────────────────────────
# Defaults here match weights/channel_adaptive_dino_vitl16_pretrain_cells-
# ef7c17ff.pth's real, verified architecture (bag-of-channels vit_large/
# patch16/224 -- see docs/architecture.md's "Real checkpoint" section).
# cell_dino_checkpoint itself is deliberately left unset above (required,
# no default) since a checkpoint path is deployment-specific and weights/
# is gitignored.
cell_dino_arch: "vit_large"
cell_dino_patch_size: 16
cell_dino_crop_size: 224        # must match BUILD_DATASET's per-experiment `window`
cell_dino_channels: [0, 1, 2, 3]                          # which crop channel indices to embed, in order
cell_dino_apply_mask: true    # apply the shared per-cell mask to EVERY selected channel (one mask per cell, no channel axis)
cell_dino_channel_pool: "mean"  # mean | max | cls_concat
cell_dino_device: "cuda"
cell_dino_batch_size: 256
cell_dino_num_workers: 4

# ── Label column, shared pipeline-wide ──────────────────────────────────────
# Read by QC_FILTER, FILTER_EMBEDDINGS, AGGREGATE_EMBEDDINGS, OVWT_BATCHWISE,
# both global stages, and their CellProfiler-feature-track counterparts
# (FILTER_CP_FEATURES, AGGREGATE_CP_FEATURES, OVWT_BATCHWISE_CP_FEATURES,
# GLOBAL_VARIANT_CP_FEATURES, GLOBAL_VARIANT_DISTINGUISHABILITY_CP_FEATURES)
# -- one override changes the variant label column everywhere at once,
# rather than each stage needing its own.
filter_label_column: "meta_aa_changes"

# ── Aggregation (AGGREGATE_EMBEDDINGS) ───────────────────────────────────────
# One or more of: mean | median | KS | AUROC | KSnegLogP | AUROCnegLogP.
# Only the literal single-element selection ["median"] keeps
# aggregate.parquet's columns bare (emb_0000..emb_{D-1}); the default
# below -- ["median", "KS", "AUROC"] -- suffixes every column by method
# instead (emb_0000_median, emb_0000_KS, emb_0000_AUROC, ...).
#
# KSnegLogP/AUROCnegLogP report -log10(p) for the KS/AUROC statistics
# (see docs/cli/aggregate.md). Deliberately NOT in the default: they cost
# ~5.6x and ~2.9x their base statistic, and they're raw uncorrected
# p-values over every embedding dimension. Add them explicitly when you
# want evidence strength alongside effect size.
aggregate_methods: ["median", "KS", "AUROC"]

# Embedding dimensions each aggregator evaluates per Polars query. Aggregating
# every dimension in one query is what OOM-kills a full-size AGGREGATE_EMBEDDINGS
# or AGGREGATE_HALF task: peak memory scales with chunk_size x n_variant_labels,
# and for the reference-based aggregators (KS/AUROC and the two *negLogP
# variants) with the cross-joined control pool on top of that.
#
# THIS VALUE IS SIZED TO THE MEMORY ONE TASK IS GRANTED, not to the embedding
# dimensionality. fisseq-data-pipeline measured the reference-based aggregators
# at roughly 3 GB (AUROC) to 4.5 GB (KS, the worst) per feature in the chunk at
# production shape, giving:
#
#     chunk_size ~= (memory_per_task_GB - 1) / 4.5
#
#   16 GB/task -> 4      64 GB/task -> 14
#   32 GB/task -> 8     128 GB/task -> 32   <- the default below
#
# mean/median are not the constraint at any chunk size in this range. Runtime is
# dominated by the NUMBER of chunks rather than their width, so raising this only
# helps until memory runs out; if KS/AUROC tasks come back killed (exit 137),
# halve it first. A run using only mean/median can raise it freely.
#
# It is a pure memory dial: the output is identical at every value, which
# tests/unit/test_aggregate.py asserts directly. null disables chunking entirely
# (every dimension in one query) -- an escape hatch for small inputs, not a
# setting for a full-size batch. Shared by both tracks (AGGREGATE_EMBEDDINGS,
# AGGREGATE_CP_FEATURES, AGGREGATE_HALF, AGGREGATE_PASSTHROUGH) for the same
# reason: it is about the task's memory, not the feature space.
aggregate_feature_chunk_size: 32

# ── Passthrough aggregates (AGGREGATE_PASSTHROUGH, cellDINO track only) ──────
# Methods that are computed and reported per variant but kept out of
# reproducibility filtering entirely: no bootstrap halves, no correlation, no
# blocklist -- and, critically, out of the cross-experiment median and the PCA.
#
# Intended for the p-value statistics (KSnegLogP, AUROCnegLogP), which are wanted
# in the output but are not reproducibility statistics: a median-correlation
# threshold is not a meaningful test for a p-value, and blocking a dimension's
# p-value while keeping its statistic would make the output incoherent.
#
# Must not overlap aggregate_methods (validate_config rejects that up front);
# [] = none, the default.
#
# Passthrough columns land ONLY in
# feature_select_batchwise/<batch>/aggregate_with_passthrough.parquet, never in
# filtered_aggregate.parquet. That file split is what keeps them out of PCA --
# GLOBAL_VARIANT_EMBEDDINGS re-reads its input from disk and picks feature
# columns with FEATURE_SELECTOR (exclude meta_*), which would happily match a
# stat-suffixed emb_0000_KSnegLogP. aggregate_with_passthrough.parquet is
# terminal: nothing in-pipeline reads it, and any future stage that does must not
# assume FEATURE_SELECTOR over IT yields reproducibility-filtered features.
aggregate_methods_passthrough: []

# ── Reproducibility filtering (cellDINO track only) ──────────────────────────
# GENERATE_SPLIT -> AGGREGATE_HALF -> CORRELATE_FEATURES -> BLOCKLIST ->
# COMBINE_BLOCKLISTS -> FILTER_AGGREGATE, sitting between AGGREGATE_EMBEDDINGS'
# aggregate.parquet and GLOBAL_VARIANT_EMBEDDINGS. A dimension is reproducible
# if the variant-to-variant pattern it reports from one random half of an
# experiment's cells is the pattern it reports from the other half.
#
# Deliberately NOT applied to the CellProfiler track: its columns are
# hand-engineered and already curated, and the two tracks' aggregates are meant
# to stay directly comparable to the published CellProfiler analysis.
#
# Number of pseudo-replicate splits per experiment. Each one is a fresh
# stratified 50/50 split at random_seed + rep, and BLOCKLIST takes the MEDIAN
# correlation across them, so one pathological split cannot condemn or rescue a
# dimension. Must be >= 2. The cost is linear: reps x 2 x len(aggregate_methods)
# AGGREGATE_HALF jobs per experiment.
reproducibility_bootstrap_reps: 10
# Minimum median Pearson r (across replicates) for a dimension to be kept.
reproducibility_min_correlation: 0.5
# GLOBAL_BLOCKLIST's cross-experiment vote: the minimum number of experiments
# that must mark a dimension reproducible in their own blocklist for it to be
# globally reproducible. null = it must be ok in every experiment that reported
# on it. Lower it to tolerate one bad experiment without losing a dimension
# everywhere.
reproducibility_global_min_batches_ok: null

# ── Aggregation (AGGREGATE_CP_FEATURES) ──────────────────────────────────────
# Same choices as aggregate_methods above, applied to the CellProfiler-
# feature track. Stays median-only by default -- CellProfiler features are
# hand-engineered, interpretable columns where a single median summary is
# the established baseline; KS/AUROC and the two *negLogP methods remain
# available as an explicit opt-in (one registry serves both tracks).
aggregate_methods_cp_features: ["median"]

# ── OVWT Distinguish-ability Scores (OVWT_BATCHWISE) ─────────────────────────
# Also reused, unchanged, by OVWT_BATCHWISE_CP_FEATURES -- these are
# scoring-methodology hyperparameters, not tied to feature type, so there
# is no parallel "_cp_features" set for them.
ovwt_wt_label: "WT"
# Fold scheme, "kfold" or "barcode_holdout".
#   kfold           -- ovwt_n_folds folds, stratified jointly on
#                      (meta_barcode, is_wt); every fold's model has seen every
#                      barcode.
#   barcode_holdout -- whole barcodes are held out of training a fold at a
#                      time, so no model is ever trained on a barcode it later
#                      scores and the AUROCs measure generalization to an
#                      unseen barcode. Wildtype cells are still split across
#                      the folds. A variant with only one barcode is skipped
#                      (nothing left to train on).
ovwt_cv_mode: "kfold"
# Folds per variant. Under "kfold" this is the fold count outright. Under
# "barcode_holdout" it caps the folds: the variant's barcodes are packed into
# at most this many cell-count-balanced groups, one group held out per fold, so
# a variant with fewer barcodes than this simply gets one fold per barcode.
# null = one fold per barcode always (pure leave-one-barcode-out); it is an
# error under "kfold", which has no barcode count to fall back on. Must be >= 2.
ovwt_n_folds: 5
ovwt_calibrate: true
ovwt_min_cells: 250
ovwt_downsample_wt: true

# ── Global Variant Embeddings (GLOBAL_VARIANT_EMBEDDINGS) ────────────────────
# No n_components entry -- every retained principal component is always
# computed and written (median_aggregate.parquet, pca_scores.parquet,
# pca_components.parquet, pca_variance_explained.parquet).
# cumulative_variance_explained instead controls only the additional
# pca_reduced.parquet output (PC-truncated scores + propagated meta_is_control
# + meta_impact_score computed on that reduced matrix).
global_variant_embeddings_cumulative_variance_explained: 0.9

# ── Global Variant CellProfiler Features (GLOBAL_VARIANT_CP_FEATURES) ───────
# Same meaning as global_variant_embeddings_cumulative_variance_explained
# above, applied to the CellProfiler-feature track's own pca_reduced.parquet.
global_variant_cp_features_cumulative_variance_explained: 0.9
